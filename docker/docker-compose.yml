services:
  api:
    image: fakenews-api
    container_name: fakenews-api
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
      - ./src:/app/src
    environment:
      - MODEL_PATH=models/model.pkl
      - PORT=5000
      - MLFLOW_TRACKING_URI=http://mlflow:5001
    depends_on:
      - mlflow
    networks:
      - mlops-network
    restart: unless-stopped

  mlflow:
    image: python:3.10-slim
    container_name: fakenews-mlflow
    working_dir: /mlflow
    command: >
      bash -c "pip install mlflow==2.10.0 -q &&
               mlflow server
               --backend-store-uri sqlite:///mlflow.db
               --default-artifact-root ./mlruns
               --host 0.0.0.0
               --port 5001"
    ports:
      - "5001:5001"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlruns:/mlflow/mlruns
    networks:
      - mlops-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: fakenews-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    networks:
      - mlops-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fakenews-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - mlops-network
    restart: unless-stopped
  
  alertmanager:
    image: prom/alertmanager:latest
    container_name: fakenews-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - mlops-network
    restart: unless-stopped

  retrain-service:
    image: python:3.11-slim
    container_name: fakenews-retrain-service
    working_dir: /app
    command: bash -c "pip install --no-cache-dir flask requests && python retrain_webhook.py"
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - ./models:/app/models
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - COOLDOWN_MINUTES=30
    networks:
      - mlops-network
    depends_on:
      - api
      - alertmanager
    restart: unless-stopped

networks:
  mlops-network:
    driver: bridge

volumes:
  grafana-storage: