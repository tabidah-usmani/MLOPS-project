name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # ← manual retrigger button on GitHub

jobs:

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 src/ api/ --max-line-length=150 --count
        # removed --exit-zero so it now actually fails on bad code

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint             # ← tests only run if lint passes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt')"

      - name: Run tests
        run: pytest tests/test_model.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]     # ← waits for both lint and test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Dockerfile
        run: cp DockerFile Dockerfile

      - name: Build Docker image
        run: docker build -t fakenews-api -f Dockerfile .

      - name: Verify image
        run: docker images fakenews-api