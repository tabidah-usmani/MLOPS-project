groups:
  - name: drift_alerts
    interval: 30s
    rules:

      - alert: PredictionDriftDetected
        expr: fake_news_drift_detected == 1
        for: 2m
        labels:
          severity: warning
          component: ml-pipeline
        annotations:
          summary: "Prediction drift detected in fake news model"
          description: "Drift detected. Real ratio is {{ $value }}. Model may need retraining."

      - alert: PersistentPredictionDrift
        expr: fake_news_real_ratio > 0.75
        for: 10m
        labels:
          severity: critical
          component: ml-pipeline
        annotations:
          summary: "Persistent model drift requiring immediate action"
          description: "Real ratio has been {{ $value }} for over 10 minutes. Retraining triggered."

      - alert: RealNewsDropoff
        expr: fake_news_real_ratio < 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unusual drop in REAL news predictions"
          description: "REAL news ratio is {{ $value }}"